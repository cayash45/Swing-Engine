name: Swing Momentum Technical Validator

on:
  schedule:
    # 22:30 UTC = 04:00 AM IST next morning
    # '1-5' in UTC runs Mon-Fri night UTC -> Tue-Sat 4:00 AM IST
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # Keeps manual trigger available anytime from the Actions tab

jobs:
  run-validator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Technical Analysis Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
